<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F4F6F9"><title>ShredLog</title><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F0B429'/%3E%3Ctext x='50' y='68' font-size='58' font-family='system-ui' font-weight='bold' fill='%23151A21' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom)}
:root{--bg:#F4F6F9;--card:#FFFFFF;--card2:#EAEEF3;--line:#D7DEE7;--text:#151A21;--dim:#5F6B7A;--gold:#B07900;--goldfill:#F0B429;--blue:#2563EB;--green:#15803D;--danger:#DC2626;--dangerbg:#FEF2F2;--dangertext:#991B1B}
button{font-family:inherit;border:none}
input{font-family:inherit;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.dim{color:var(--dim)}
.gold{color:var(--gold)}
.blue{color:var(--blue)}
.green{color:var(--green)}
.btn{border-radius:10px;padding:12px 16px;font-size:15px;font-weight:650;cursor:pointer;border:none}
.bgold{background:var(--goldfill);color:var(--text)}
.bgrey{background:var(--card2);color:var(--text)}
.row{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:7px}
.inp{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 8px;font-size:16px;text-align:center;outline:none}
.chk{background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--dim);padding:10px 0;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.chk.on{background:var(--green);border-color:var(--green);color:#FFFFFF}
.lbl{font-size:10.5px;letter-spacing:.06em;color:var(--dim)}
.exname{background:none;border:none;padding:0;text-align:left;cursor:pointer;color:var(--text);font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.q{color:var(--blue);font-size:11px;border:1px solid var(--blue);border-radius:20px;width:15px;height:15px;line-height:14px;text-align:center;flex:0 0 auto}
.form{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:10px;font-size:12.5px;line-height:1.6}
#rest{position:fixed;left:0;right:0;bottom:0;background:var(--blue);color:#FFFFFF;padding:13px 18px;padding-bottom:calc(13px + env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:center;z-index:50}
.hdr{background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px 12px;padding-top:calc(16px + env(safe-area-inset-top));position:sticky;top:0;z-index:40}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
.bar>div{height:100%;background:var(--goldfill);transition:width .25s}
.dot{width:7px;height:7px;border-radius:7px;background:var(--green);display:inline-block}
textarea{width:100%;min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;line-height:1.6;resize:none}
a{color:var(--blue)}
</style></head><body><div id="app"></div><div id="rest"><span style="font-size:13px;font-weight:650">Rest</span><span id="restT" style="font-size:24px;font-weight:750"></span><button onclick="skipRest()" style="background:rgba(255,255,255,.22);border:none;border-radius:8px;color:#FFFFFF;padding:7px 13px;font-weight:650;font-size:13px">Skip</button></div><script>

const FORM={"p1":{"setup":"Bench at 30–45°. Dumbbells resting on your thighs, kick them up one at a time as you lie back.","execute":"Lower until your elbows are just below torso level and you feel the stretch across the upper chest. Press up and slightly inward. Elbows tucked ~45° from your body, not flared to 90°.","avoid":"Bouncing off the chest, or setting the bench so steep it becomes a shoulder press. 30° is plenty."},"p2":{"setup":"Eyes under the bar. Shoulder blades pinched back and down into the bench, small arch in the lower back, feet planted.","execute":"Lower to mid-chest with control, elbows ~45°. Drive through the floor as you press.","avoid":"Letting your shoulder blades unpinch at the top — that's where pec and shoulder strains come from."},"p3":{"setup":"Cables set at the LOWEST pin. Stand in the middle, one foot slightly forward, slight bend in the elbows that never changes.","execute":"Start with hands low and wide. Sweep up and together as if hugging a barrel, finishing at upper-chest height. Squeeze for a beat.","avoid":"Turning it into a press by bending the elbows. The elbow angle is locked the whole set — that's what keeps tension on the pec."},"p4":{"setup":"Adjust the seat so the handles sit level with your shoulders — too low and it becomes a chest press, too high and you lose range. Back flat against the pad.","execute":"Press to near lockout without slamming. Lower under control until your upper arms are level with your shoulders.","avoid":"Arching your lower back off the pad to grind out a rep, and cutting the bottom of the range short."},"p5":{"setup":"Cable at the lowest pin, handle in the hand furthest from the machine, cable crossing in front of your body.","execute":"Raise out to the side to shoulder height, leading with your elbow. Pause. Lower slowly — the negative is where most of the growth is.","avoid":"Swinging. If your torso rocks to get the weight up, drop to 10 lb."},"p6":{"setup":"Rope on a high pulley. Face away, staggered stance, hinge forward slightly. Rope behind your head, elbows pointing forward.","execute":"Extend at the elbow until your arms are straight, spreading the rope at the end. Let the weight pull your hands back behind your head for a full stretch.","avoid":"Letting your elbows drift outward or downward. They stay high and fixed."},"p7":{"setup":"Rope on a high pulley. Elbows pinned to your ribs, slight forward lean.","execute":"Push down and spread the rope apart at the bottom. Full lockout.","avoid":"Using your shoulders to push the weight down. Only the elbow joint moves."},"p8":{"setup":"Hang from a bar, shoulders active (not fully relaxed). Straight legs.","execute":"Curl your pelvis up toward your ribs and raise your legs — the pelvic tilt is the actual ab work, the leg raise is mostly hip flexor.","avoid":"Swinging. If you can't control it, do knee raises until you can, then progress."},"l1":{"setup":"Dumbbell held between your feet or a loaded backpack. Grip slightly wider than shoulders, palms forward.","execute":"Pull your elbows down and back, driving your chest toward the bar. Chin over the bar. Lower under control to a full hang.","avoid":"Half reps. A full stretch at the bottom is where lat width comes from."},"l2":{"setup":"Chest against the pad, feet planted. Set the pad so your arms can fully extend without your chest lifting off.","execute":"Pull the handles toward your lower ribs, driving your elbows back and squeezing your shoulder blades together. Pause at the contraction.","avoid":"Heaving your chest off the pad. If it lifts, the weight is too heavy — the pad is what makes this exercise honest."},"l3":{"setup":"Neutral (palms-facing) grip. Thighs locked under the pad, slight backward lean of about 15°.","execute":"Pull to your upper chest, elbows driving down toward your hips. Control the way up until your lats are fully stretched.","avoid":"Leaning back into a row. A little lean is fine, swinging is not."},"l4":{"setup":"Chest on the pad, arms extended forward at shoulder height, slight elbow bend.","execute":"Sweep your arms out and back in a wide arc, leading with your elbows. Squeeze the rear delts, then return slowly.","avoid":"Using your traps and biceps. Think of your hands as hooks — the elbows do the travelling."},"l5":{"setup":"Bench at 45–60°. Sit back fully so your arms hang BEHIND your torso. That hanging position is the whole point.","execute":"Curl up without letting your elbow drift forward. Lower all the way until your arm is straight and you feel the biceps stretch.","avoid":"Letting your shoulder roll forward at the bottom. Keep your chest up and shoulders back on the bench."},"l6":{"setup":"Neutral grip, palms facing each other, dumbbells at your sides.","execute":"Curl straight up keeping the palms facing in the whole way. Elbows stay pinned to your ribs.","avoid":"Rotating the wrist. Hammer grip throughout — that's what hits the brachialis and thickens the arm."},"l7":{"setup":"Kneel facing a high cable with a rope. Rope beside your head or at your temples. Hips stay fixed.","execute":"Crunch by rounding your spine and bringing your ribs toward your pelvis. Your elbows travel toward your thighs.","avoid":"Hinging at the hips instead of flexing your spine. If your back stays flat, you're doing a hip movement, not an ab one."},"g1":{"setup":"Feet on the platform shoulder-width, shoulders under the pads, back flat against the backrest.","execute":"Descend under control to at least parallel, keeping tension in the quads. Drive up through mid-foot.","avoid":"Going to true failure on every set. Stop at 1–2 reps in reserve — especially with your knee."},"g2":{"setup":"Barbell at hip height, feet hip-width, knees SOFT and fixed. Bar stays in contact with your legs the whole way.","execute":"Push your hips straight back, letting the bar slide down your thighs. Stop when your hamstrings are fully stretched — usually mid-shin. Drive your hips forward to stand.","avoid":"Bending the knees more ty than the machine — expect to use less weight."},"d3":{"setup":"One arm at a time, cable at the lowest pin, standing side-on so the cable crosses your body.","execute":"Raise to shoulder height leading with the elbow. Cables keep tension at the bottom where dumbbells lose it — that's why both are in the program.","avoid":"Leaning away from the machine to cheat the weight up."},"d4":{"setup":"Chest on the pad, arms extended, slight elbow bend.","execute":"Sweep out and back in a wide arc, elbows leading, squeeze, return slowly.","avoid":"Shrugging your shoulders up toward your ears."},"d5":{"setup":"EZ bar, shoulder-width on the angled grips. Elbows pinned to your ribs. Set the bar down next to the bench before you start so you are not crossing the gym mid-round.","execute":"Curl up, squeeze, lower under full control. ","avoid":"Swinging your hips to start the rep."},"d6":{"setup":"Bench, hands about shoulder-width — NOT narrower, that just wrecks your wrists.","execute":"Lower to your lower chest with elbows tucked tight to your sides. Press up. ","avoid":"Flaring your elbows. Tucked elbows are what make it a triceps exercise."},"d7":{"setup":"Straight bar or rope on a low pulley.","execute":"Curl up with elbows fixed at your sides. Squeeze at the top. ","avoid":"Letting your elbows travel forward as you curl."},"d8":{"setup":"Rope on a high pulley, facing away, hinged slightly forward.","execute":"Extend fully, spreading the rope. Let your hands drop behind your head for the stretch. ","avoid":"Dropping the elbows. They stay high and pointed forward."},"d9":{"setup":"Cable at chest height. Stand SIDE-ON to the machine, feet shoulder-width, knees soft. Both hands on the handle at your sternum. Step away until there is real tension.","execute":"Press your hands straight out until your arms lock. The cable is now trying to rotate you toward the machine — resist it. Hold 2–3 seconds, return to your chest. All reps one side, then turn around.","avoid":"Any twist at all. If your torso rotates, it's too heavy. Brace your abs, squeeze your glutes, keep breathing. This is the one exercise where nothing should visibly move."},"d10":{"setup":"Kneel facing a high cable, rope at your temples, hips fixed.","execute":"Round your spine, bringing ribs toward pelvis.","avoid":"Hinging at the hips instead of flexing the spine."},"c1":{"setup":"Treadmill at 12–15% incline, or a bike or rower.","execute":"Conversational pace — you should be able to speak in full sentences but not comfortably sing. 30 minutes.","avoid":"Pushing the pace. Going harder here eats into recovery and defeats the purpose."},"c2":{"setup":"Bench at 30–45°. Take the incline option every time on this day.","execute":"Lower to a stretch, press up and slightly in. Higher reps than Monday — chase the pump here, not the load.","avoid":"Substituting a flat press. Upper chest is the visual gap; this session exists for it."},"c3":{"setup":"Cables low, slight fixed elbow bend.","execute":"Sweep up and together, squeeze, control the way back to a full stretch.","avoid":"Pressing instead of flying."},"c4":{"setup":"High cable, straight bar or rope. Stand back, hinge slightly forward, arms overhead and straight.","execute":"Keeping your arms straight, pull the bar down in an arc to your thighs using only your lats. Squeeze at the bottom.","avoid":"Bending the elbows — that turns it into a pushdown and the lats stop working."},"c5":{"setup":"Hips on the pad, feet secured, body straight.","execute":"Hinge down until you feel the hamstring stretch, then raise until your body is straight. Hold a plate to your chest to add load.","avoid":"Hyperextending past straight at the top."},"c6":{"setup":"Hang from a bar, or decline bench with a plate held at your chest.","execute":"Curl the pelvis toward the ribs. Add weight once 15 reps is comfortable.","avoid":"Swinging for momentum."},"c7":{"setup":"Light cable or band at chest height, standing facing away.","execute":"Punch straight forward, letting your shoulder blade slide FORWARD around your ribcage at the end. That protraction is the whole exercise.","avoid":"Treating it as a chest press. The range that matters is the last few inches."},"c8":{"setup":"Bike, rower, or treadmill. After your zone 2.","execute":"20 seconds hard, 40 seconds easy, eight rounds.","avoid":"Doing this more than once a week. It costs recovery you need for lifting."}};

function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function del(k){try{localStorage.removeItem(k)}catch(e){}}

}

const pad=n=>String(n).padStart(2,'0');
const clock=s=>Math.floor(s/60)+':'+pad(s%60);
const today=()=>new Date().toISOString().slice(0,10);
const daysTo=d=>Math.max(0,Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5));
const pretty=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});

function best(rows){const d=(rows||[]).filter(r=>r.done&&r.reps);if(!d.length)return null;return d.reduce((a,b)=>(+(b.weight||0)>+(a.weight||0)?b:a));}
function lastFor(dayId,exId){for(let i=history_.length-1;i>=0;i--){const s=history_[i];if(s.dayId===dayId&&s.entries[exId]){const b=best(s.entries[exId]);if(b)return{...b,date:s.date};}}return null;}
function lastDone(dayId){for(let i=history_.length-1;i>=0;i--)if(history_[i].dayId===dayId)return history_[i].date;return null;}
function groupEx(list){const out=[];list.forEach(ex=>{const p=out[out.length-1];if(ex.ss&&p&&p.ss===ex.ss)p.items.push(ex);else out.push({ss:ex.ss||null,items:[ex]});});return out;}
function seedRow(exId){const d=PROGRAM.find(x=>x.id===active.dayId);const e=d&&d.exercises.find(z=>z.id===exId);const sd=(e&&e.seed)||{};return{weight:sd.w!=null?String(sd.w):'',reps:sd.r!=null?String(sd.r):'',done:false,prefill:true};}

let wakeMode='off',wakeErr='',noSleepVid=null;
function setWakeMode(m,err){wakeMode=m;wakeErr=err||'';if(view==='workout'&&!suppressWakeRender)render();}
async function getWake(){
  if(wakeMode!=='off'&&wakeMode!=='failed')return;
  try{if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;if(wantWake&&wakeMode==='lock'){wakeMode='off';playNoSleep();}});setWakeMode('lock');return;}wakeErr='Not supported';}
  catch(e){wakeErr=(e&&e.name==='NotAllowedError')?'Blocked — check Low Power Mode':(e&&e.message)||'Refused';}
  await playNoSleep();
}
async function playNoSleep(){
  try{if(!noSleepVid){noSleepVid=document.createElement('video');noSleepVid.setAttribute('playsinline','');noSleepVid.setAttribute('muted','');noSleepVid.muted=true;noSleepVid.loop=true;const s1=document.createElement('source');s1.src=NOSLEEP_WEBM;s1.type='video/webm';const s2=document.createElement('source');s2.src=NOSLEEP_MP4;s2.type='video/mp4';noSleepVid.appendChild(s1);noSleepVid.appendChild(s2);noSleepVid.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;left:0';document.body.appendChild(noSleepVid);}
  await noSleepVid.play();setWakeMode('video');}catch(e2){setWakeMode('failed',wakeErr||'Could not keep screen on');}
}
function dropWake(){suppressWakeRender=true;wantWake=false;try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;try{noSleepVid&&noSleepVid.pause()}catch(e){}setWakeMode('off');suppressWakeRender=false;}
function toggleWake(){if(wakeMode==='off'||wakeMode==='failed'){wantWake=true;getWake();}else{wantWake=false;dropWake();}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){persist();}else if(active&&wakeMode!=='off')getWake();});
window.addEventListener('pagehide',persist);
window.addEventListener('beforeunload',persist);

/* ── actions ── */
function start(id){
  const day=PROGRAM.find(d=>d.id===id);
  const entries={},exFeedback={};
  day.exercises.forEach(ex=>{
    const sd=ex.seed||{};
    entries[ex.id]=Array.from({length:ex.sets},()=>({weight:sd.w!=null?String(sd.w):'',reps:sd.r!=null?String(sd.r):'',done:false,prefill:true}));
    exFeedback[ex.id]={rpe:null,pain:0,tank:null,variant:'',note:''};
  });
  const exVariant={};
  day.exercises.forEach(function(ex){
    if(ex.variants&&Object.keys(ex.variants).length>0){
      exVariant[ex.id]=ex.defaultVariant||Object.keys(ex.variants)[0];
    }
  });
  active={dayId:id,dayName:day.name,date:today(),startedAt:Date.now(),entries,exFeedback,exVariant:exVariant};
  restored=false;persist();wantWake=true;getWake();view='workout';render();
}
function resume(){view='workout';wantWake=true;getWake();render();}
function setField(ex,i,f,v,el){
  const row=active.entries[ex][i];row[f]=v;row['t_'+f]=true;
  const wReal=row.t_weight&&String(row.weight).trim()!=='';
  const rReal=row.t_reps&&String(row.reps).trim()!=='';
  if(!wReal&&!rReal&&!row.done){active.entries[ex][i]=seedRow(ex);persist();render();return;}
  row.prefill=false;
  if(el){const cell=el.parentNode;if(cell){cell.querySelectorAll('input.inp').forEach(inp=>styleCell(inp,false));}}
  persist();
}
function toggle(exId,i){
  const day=PROGRAM.find(d=>d.id===active.dayId);
  const ex=day&&day.exercises.find(e=>e.id===exId);
  const r=active.entries[exId][i];r.done=!r.done;r.prefill=false;persist();
  if(r.done&&ex&&ex.rest>0)startRest(ex.rest);
  render();
}
function finish(){
  const dur=Math.floor((Date.now()-active.startedAt)/1000);
  const cleaned={dayId:active.dayId,dayName:active.dayName,date:active.date,durationSec:dur,entries:{},exFeedback:active.exFeedback||{},exVariant:active.exVariant||{}};
  Object.entries(active.entries).forEach(([k,rows])=>{const kept=rows.filter(r=>r.done||(!r.prefill&&(r.reps||r.weight)));if(kept.length)cleaned.entries[k]=kept;});
  history_.push(cleaned);
  if(!save(K_HIST,history_)){history_.pop();saveFailed=true;render();return;}
  saveFailed=false;view='home';del(K_ACT);del(K_BAK);active=null;skipRest();dropWake();render();
}
function discardTap(){
  if(!confirmDiscard){confirmDiscard=true;render();setTimeout(()=>{if(confirmDiscard){confirmDiscard=false;render();}},4000);return;}
  confirmDiscard=false;view='home';del(K_ACT);del(K_BAK);active=null;skipRest();dropWake();render();
}
function delTap(i){
  if(confirmDel!==i){confirmDel=i;render();setTimeout(()=>{if(confirmDel===i){confirmDel=null;render();}},4000);return;}
  confirmDel=null;history_.splice(i,1);save(K_HIST,history_);render();
}
function go(v){confirmDel=null;view=v;render();}

/* ── feedback ── */
function updateFb(ex,f,v){
  if(!active.exFeedback)active.exFeedback={};
  if(!active.exFeedback[ex])active.exFeedback[ex]={rpe:null,pain:0,tank:null,variant:'',note:''};
  const fb=active.exFeedback[ex];
  if(f==='pain')fb[f]=(fb[f]===+v)?0:+v;
  else if(f==='rpe')fb[f]=(fb[f]===+v)?null:+v;
  else if(f==='tank')fb[f]=(fb[f]===v)?null:v;
  else fb[f]=(fb[f]===v?'':v);
  persist();
  const wasOpen=document.getElementById('fbd-'+ex)&&document.getElementById('fbd-'+ex).style.display==='flex';
  const wrapper=document.querySelector('.fb-toggle[data-ex="'+ex+'"]')?.parentElement;
  const drawer=document.getElementById('fbd-'+ex);
  const toggle=document.querySelector('.fb-toggle[data-ex="'+ex+'"]');
  if(drawer){drawer.innerHTML=buildDrawerContents(ex,fb);}
  if(toggle){
    const hasData=fb.tank||fb.rpe||fb.pain>0||fb.variant||fb.note;
    toggle.style.background=hasData?'color-mix(in srgb,var(--blue) 8%,transparent)':'var(--card2)';
    toggle.style.color=hasData?'var(--blue)':'var(--dim)';
    toggle.innerHTML=hasData?'✏️&#8201; Feedback':'&#xFF0B;&#8201; Add feedback';
  }
}
function toggleFbDrawer(exId){
  const d=document.getElementById('fbd-'+exId);if(!d)return;
  const open=d.style.display==='flex';d.style.display=open?'none':'flex';
  const btn=document.querySelector('.fb-toggle[data-ex="'+exId+'"]');
  if(btn)btn.innerHTML=open?'&#xFF0B;&#8201; Add feedback':'&#9660;&#8201; Feedback';
}
document.addEventListener('click',function(e){
  const btn=e.target.closest('.fb-btn');if(!btn||!active)return;
  updateFb(btn.dataset.ex,btn.dataset.f,btn.dataset.v);
});
function switchVariant(exId, variantKey) {
  if(!active)return;
  const day=PROGRAM.find(d=>d.id===active.dayId);
  const ex=day&&day.exercises.find(e=>e.id===exId);
  if(!ex||!ex.variants||!ex.variants[variantKey])return;
  const v=ex.variants[variantKey];
  // re-seed all rows for this exercise with the variant's values
  active.entries[exId]=Array.from({length:ex.sets},function(){
    return {weight:v.w||'',reps:v.r||'',done:false,prefill:true};
  });
  if(!active.exVariant)active.exVariant={};
  active.exVariant[exId]=variantKey;
  persist();
  // Surgical DOM update — avoid full render() which loses scroll position
  // Find the card containing this exercise and rebuild just the set inputs and chips
  var rowEls=document.querySelectorAll('.row[data-exid="'+exId+'"]');
  rowEls.forEach(function(row,i){
    var r=active.entries[exId][i]||{};
    var inputs=row.querySelectorAll('input.inp');
    if(inputs[0]){inputs[0].value=r.weight;styleCell(inputs[0],true);}
    if(inputs[1]){inputs[1].value=r.reps;styleCell(inputs[1],true);}
  });
  // Update variant chip highlight
  var day2=PROGRAM.find(function(d){return d.id===active.dayId;});
  var ex2=day2&&day2.exercises.find(function(e){return e.id===exId;});
  var defaultV2=ex2&&(ex2.defaultVariant||Object.keys(ex2.variants||{})[0]);
  document.querySelectorAll('button[data-exid="'+exId+'"][data-variant]').forEach(function(btn){
    var on=btn.dataset.variant===variantKey;
    var isDef=btn.dataset.variant===defaultV2;
    if(on&&isDef){
      btn.style.background='color-mix(in srgb,var(--green) 8%,transparent)';
      btn.style.color='var(--green)'; btn.style.fontWeight='650';
      btn.style.border='1px solid var(--line)';
      btn.style.boxShadow='inset 0 -2px 0 var(--green)';
    } else if(on){
      btn.style.background='var(--card)'; btn.style.color='var(--text)';
      btn.style.fontWeight='650'; btn.style.border='1px solid var(--line)';
      btn.style.boxShadow='inset 0 -2px 0 var(--blue)';
    } else if(isDef){
      btn.style.background='color-mix(in srgb,var(--green) 6%,transparent)';
      btn.style.color='var(--green)'; btn.style.fontWeight='500';
      btn.style.border='1px solid color-mix(in srgb,var(--green) 25%,transparent)';
      btn.style.boxShadow='none';
    } else {
      btn.style.background='var(--card2)'; btn.style.color='var(--dim)';
      btn.style.fontWeight='400'; btn.style.border='1px solid var(--line)';
      btn.style.boxShadow='none';
    }
  });
  // Update target text if present
  var targetEl=document.querySelector('[data-target-exid="'+exId+'"]');
  if(targetEl&&v.target)targetEl.textContent=v.target;
}

function addWarmup(exId){
  if(!active)return;
  active.entries[exId]=[{weight:'',reps:'',done:false,prefill:false,warmup:true},...active.entries[exId]];
  persist();render();
}
function removeWarmup(exId){
  if(!active)return;
  // Remove the last warmup row
  const idx=active.entries[exId].map(function(r,i){return r.warmup?i:-1;}).filter(function(i){return i>=0;}).pop();
  if(idx!=null)active.entries[exId].splice(idx,1);
  persist();render();
}
document.addEventListener('input',function(e){
  if(!e.target.classList.contains('fb-note'))return;
  const ex=e.target.dataset.ex;
  if(!active||!ex)return;
  if(!active.exFeedback)active.exFeedback={};
  if(!active.exFeedback[ex])active.exFeedback[ex]={rpe:null,pain:0,tank:null,variant:'',note:''};
  active.exFeedback[ex].note=e.target.value;persist();
});

/* ── rest timer ── */
function startRest(s){restLeft=s;clearInterval(restTimer);restTimer=setInterval(()=>{restLeft--;if(restLeft<=0){skipRest();return;}paintRest();},1000);paintRest();}
function skipRest(){clearInterval(restTimer);restLeft=null;document.getElementById('rest').style.display='none';}
function paintRest(){const e=document.getElementById('rest');if(restLeft===null){e.style.display='none';return;}e.style.display='flex';document.getElementById('restT').textContent=clock(restLeft);}

/* ── style helpers ── */
function styleCell(el,prefill){if(!el)return;el.style.color=prefill?'#AEB6C2':'var(--text)';el.style.fontWeight=prefill?'400':'700';el.style.background=prefill?'var(--bg)':'#FFFFFF';}

/* ── feedback builder ── */
function buildDrawerContents(exId,fb){
  fb=fb||{rpe:null,pain:0,tank:null,variant:'',note:''};
  const pe=['','😊','😐','😬','🔴'],pt=['','None','Slight','Moderate','Stop'];
  let h='';
  // tank
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  [['all-in','💪','All in'],['tank','🛢','Had more']].forEach(function(vl){
    const v=vl[0],ico=vl[1],lbl=vl[2],on=fb.tank===v;
    h+='<button class="fb-btn" data-ex="'+esc(exId)+'" data-f="tank" data-v="'+v+'" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 0;border:2px solid '+(on?'var(--blue)':'var(--line)')+';border-radius:10px;background:'+(on?'color-mix(in srgb,var(--blue) 10%,transparent)':'var(--card)')+';color:'+(on?'var(--blue)':'var(--dim)')+';font-size:13px;font-weight:'+(on?700:500)+';cursor:pointer"><span style="font-size:17px">'+ico+'</span><span>'+lbl+'</span></button>';
  });
  h+='</div>';
  // effort
  h+='<div><div style="font-size:9.5px;letter-spacing:.12em;color:var(--dim);margin-bottom:7px">EFFORT</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px">';
  [[6,'Easy'],[7,'Mod.'],[8,'Hard'],[9,'V.Hard'],[10,'Max']].forEach(function(rl){
    const r=rl[0],lbl=rl[1],on=fb.rpe===r;
    h+='<button class="fb-btn" data-ex="'+esc(exId)+'" data-f="rpe" data-v="'+r+'" style="display:flex;flex-direction:column;align-items:center;padding:7px 2px;gap:1px;border:2px solid '+(on?'var(--goldfill)':'var(--line)')+';border-radius:9px;background:'+(on?'color-mix(in srgb,var(--goldfill) 12%,transparent)':'var(--card)')+';color:'+(on?'var(--gold)':'var(--dim)')+';cursor:pointer"><span style="font-size:15px;font-weight:700">'+r+'</span><span style="font-size:8.5px;text-align:center;line-height:1.2">'+lbl+'</span></button>';
  });
  h+='</div></div>';
  // pain
  h+='<div><div style="font-size:9.5px;letter-spacing:.12em;color:var(--dim);margin-bottom:7px">PAIN</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">';
  [[1,'😊','None'],[2,'😐','Slight'],[3,'😬','Moderate'],[4,'🔴','Stop']].forEach(function(pl){
    const p=pl[0],ico=pl[1],lbl=pl[2],on=fb.pain===p;
    h+='<button class="fb-btn" data-ex="'+esc(exId)+'" data-f="pain" data-v="'+p+'" style="display:flex;flex-direction:column;align-items:center;padding:7px 4px;gap:1px;border:2px solid '+(on?'#DC2626':'var(--line)')+';border-radius:9px;background:'+(on?'#FEF2F2':'var(--card)')+';cursor:pointer"><span style="font-size:17px">'+ico+'</span><span style="font-size:8.5px;color:'+(on?'#DC2626':'var(--dim)')+'">'+lbl+'</span></button>';
  });
  h+='</div></div>';
  // note
  h+='<input class="fb-note" data-ex="'+esc(exId)+'" type="text" value="'+esc(fb.note||'')+'" placeholder="Anything worth noting…" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:13px 14px;font-size:14px;outline:none;box-sizing:border-box">';
  return h;
}

function buildFeedback(exId,fb){
  fb=fb||{rpe:null,pain:0,tank:null,variant:'',note:''};
  const hasData=fb.tank||fb.rpe||fb.pain>0||fb.variant||fb.note;
  let h='<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">';
  h+='<button class="fb-toggle" data-ex="'+esc(exId)+'" onclick="toggleFbDrawer(this.dataset.ex)"'
   +' style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border:none;border-radius:8px;background:'+(hasData?'color-mix(in srgb,var(--blue) 8%,transparent)':'var(--card2)')+';color:'+(hasData?'var(--blue)':'var(--dim)')+';font-size:12px;font-weight:600;cursor:pointer">'
   +(hasData?'✏️&#8201; Feedback':'＋&#8201; Add feedback')+'</button>';
  h+='<div class="fb-drawer" id="fbd-'+esc(exId)+'" style="display:none;flex-direction:column;gap:14px;margin-top:12px;padding:14px;background:var(--card2);border-radius:12px;border:1px solid var(--line)">';
  h+=buildDrawerContents(exId,fb);
  h+='</div></div>';
  return h;
}

function exportText(){
  if(!history_.length)return 'No sessions logged yet.';
  const NL=String.fromCharCode(10);
  const out=['SHREDLOG EXPORT — v'+APP_VERSION,''];
  history_.forEach(function(s){
    out.push('## '+s.dayName+' — '+s.date+(s.durationSec?'  ('+Math.round(s.durationSec/60)+' min)':''));
    const day=PROGRAM.find(d=>d.id===s.dayId);
    Object.entries(s.entries).forEach(function([id,rows]){
      const ex=day&&day.exercises.find(e=>e.id===id);
      const body=rows.map(r=>r.weight?(r.weight+'×'+(r.reps||'?')):(r.reps||'?')).join(', ');
      const usedVariant=s.exVariant&&s.exVariant[id];
      out.push('- '+(ex?ex.name:id)+(usedVariant?' ['+usedVariant+']':'')+': '+body);
      const fb=s.exFeedback&&s.exFeedback[id];
      if(fb&&(fb.tank||fb.rpe||fb.pain>0||fb.variant||fb.note)){
        const parts=[];
        if(fb.tank)parts.push(fb.tank==='all-in'?'All in':'Had more');
        if(fb.rpe)parts.push('RPE '+fb.rpe);
        if(fb.pain>0)parts.push(['','None','Slight','Moderate','Stop'][fb.pain]+' pain');
        if(fb.variant)parts.push(fb.variant);
        if(fb.note)parts.push('"'+fb.note+'"');
        out.push('  → '+parts.join(' · '));
      }
    });
    out.push('');
  });
  return out.join(NL);
}
function copyExp(){
  const t=document.getElementById('exp');const btn=document.getElementById('cpy');
  const done=ok=>{if(!btn)return;btn.textContent=ok?'Copied':'Select all & copy manually';setTimeout(()=>{btn.textContent='Copy to clipboard';},2200);};
  if(!t){done(false);return;}
  t.focus();t.select();try{t.setSelectionRange(0,999999);}catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>done(true)).catch(()=>{let ok=false;try{ok=document.execCommand('copy');}catch(e){}done(ok);});return;}
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}done(ok);
}

  h+='<div><div style="font-size:19px;font-weight:700;letter-spacing:-.02em">'+esc(day.name)+'</div><div class="dim" style="font-size:12px;margin-top:2px">'+esc(day.focus)+'</div></div>';
  h+='<div style="text-align:right"><div class="gold" style="font-size:22px;font-weight:700" id="elapsed">'+clock(el)+'</div>';
  h+='<div style="margin-top:2px"><span class="dim" style="font-size:11px">'+done+'/'+tot+' sets</span> <span class="dot"></span></div>';
  h+='<button onclick="toggleWake()" style="margin-top:6px;background:'+(wakeMode==='off'||wakeMode==='failed'?'transparent':'var(--green)')+';border:1px solid '+(wakeMode==='failed'?'var(--danger)':wakeMode==='off'?'var(--line)':'var(--green)')+';color:'+(wakeMode==='off'?'var(--dim)':wakeMode==='failed'?'var(--danger)':'#fff')+';border-radius:999px;padding:3px 10px;font-size:10.5px;font-weight:650;cursor:pointer">'+(wakeMode==='off'?'Keep screen on':wakeMode==='failed'?'Screen off':'Screen on')+'</button>';
  h+='</div></div><div class="bar"><div style="width:'+(tot?Math.round(done/tot*100):0)+'%"></div></div></div>';
  h+='<div class="wrap" style="padding-bottom:110px">';
  if(saveFailed)h+='<div class="card" style="border-color:var(--danger);background:var(--dangerbg);color:var(--dangertext);font-size:12.5px;line-height:1.5"><strong>Could not save.</strong> Write your numbers down before leaving.<button class="btn" style="background:var(--danger);color:#fff;padding:6px 12px;font-size:12px;margin-top:8px;display:block" onclick="finish()">Retry</button></div>';
  if(restored)h+='<div class="card" style="border-color:var(--green);background:color-mix(in srgb,var(--green) 5%,transparent);color:var(--green);font-size:12.5px">Picked your session back up where you left it.</div>';
  h+='<div class="card" style="background:var(--card2);border-left:3px solid var(--blue);font-size:12.5px;line-height:1.55"><strong style="font-size:11.5px;letter-spacing:.06em">WARM-UP</strong><div class="dim" style="margin-top:4px">'+esc(day.warmup)+'</div></div>';
  h+='<div class="card" style="background:var(--card2);border-left:3px solid var(--goldfill);font-size:12.5px;line-height:1.55"><strong style="font-size:11.5px;letter-spacing:.06em">HOW TO PROGRESS</strong><div class="dim" style="margin-top:4px">Reach the top of the rep range on every set first. Only then add load, and drop back to the bottom.</div><div class="dim" style="margin-top:6px">Cable stacks move in 10 lb steps — climb reps first. Stuck between pins? Slow the lowering to 3 seconds.</div></div>';
  groupEx(day.exercises).forEach(grp=>{
    if(!grp.ss){h+=card(grp.items[0]);return;}
    const lead=grp.items[0];
    h+='<div style="border:1px solid color-mix(in srgb,var(--blue) 28%,transparent);border-left:4px solid var(--blue);border-radius:14px;background:color-mix(in srgb,var(--blue) 5%,transparent);padding:12px 11px 11px;margin-bottom:12px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 9px"><span style="color:var(--blue);font-size:10.5px;font-weight:750;letter-spacing:.11em">SUPERSET '+grp.ss+'</span><span style="color:var(--blue);font-size:11px;font-weight:600">'+lead.sets+' rounds · no rest between</span></div>';
    grp.items.forEach((ex,ei)=>{
      if(ei>0)h+='<div style="display:flex;align-items:center;gap:8px;padding:1px 4px 7px"><span style="color:var(--blue);font-size:13px;font-weight:700">↓</span><span style="color:var(--blue);font-size:11px;font-weight:600">straight into</span><div style="flex:1;height:1px;background:color-mix(in srgb,var(--blue) 22%,transparent)"></div></div>';
      h+=card(ex);
    });
    h+='<div class="dim" style="font-size:11.5px;padding:2px 4px 0;line-height:1.5">Rest '+clock(lead.ssRest||90)+' after the pair, then start the next round.</div></div>';
  });
  h+='<div style="display:flex;gap:10px;margin-top:6px">';
  h+='<button class="btn bgold" style="flex:2" onclick="finish()">Finish workout</button>';
  h+='<button class="btn" style="flex:1;background:'+(confirmDiscard?'var(--danger)':'var(--card2)')+';color:'+(confirmDiscard?'#fff':'var(--dim)')+';font-size:'+(confirmDiscard?13:15)+'px" onclick="discardTap()">'+(confirmDiscard?'Tap again to discard':'Discard')+'</button>';
  h+='</div></div>';
  return h;
}

/* ── history ── */
function viewHistory(){
  let h='<div class="wrap"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="btn bgrey" style="padding:7px 12px" data-goto="home" onclick="go(this.dataset.goto)">←</button><span style="font-size:19px;font-weight:700">History</span></div>';
  if(!history_.length)h+='<div class="dim" style="font-size:14px;padding:28px 0">Nothing logged yet.</div>';
  history_.slice().reverse().forEach(function(s,i){
    const orig=history_.length-1-i;
    const day=PROGRAM.find(d=>d.id===s.dayId);
    h+='<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><strong style="font-size:15px">'+esc(s.dayName)+'</strong><span class="dim" style="font-size:13px">'+pretty(s.date)+(s.durationSec?' · '+Math.round(s.durationSec/60)+'m':'')+'</span></div>';
    Object.entries(s.entries).forEach(function([id,rows]){
      const ex=day&&day.exercises.find(e=>e.id===id);
      const fb=(s.exFeedback&&s.exFeedback[id])||{};
      const setStr=rows.map(r=>(r.warmup?'W:':'')+( r.weight?r.weight+'×'+r.reps:r.reps)).join(' · ');
      h+='<div style="padding:6px 0;border-bottom:1px solid var(--line)">';
      h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-size:13px;font-weight:650">'+esc(ex?ex.name:id)+'</span>'+(fb.variant?'<span style="font-size:10.5px;color:var(--green);font-weight:600">'+esc(fb.variant)+'</span>':'')+'</div>';
      h+='<div style="font-size:12px;color:var(--dim)">'+esc(setStr)+'</div>';
      if(fb.rpe||fb.pain>0||fb.tank||fb.note){
        h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px">';
        if(fb.tank)h+='<span style="font-size:10.5px;padding:2px 7px;border:1px solid var(--blue)44;border-radius:999px;color:var(--blue)">'+(fb.tank==='all-in'?'💪 All in':'🛢 Had more')+'</span>';
        if(fb.rpe)h+='<span style="font-size:10.5px;padding:2px 7px;border:1px solid var(--goldfill)55;border-radius:999px;color:var(--gold)">RPE '+fb.rpe+'</span>';
        if(fb.pain>0)h+='<span style="font-size:10.5px;padding:2px 7px;border:1px solid #DC262633;border-radius:999px;color:#DC2626">'+['','😊','😐','😬','🔴'][fb.pain]+' '+['','None','Slight','Moderate','Stop'][fb.pain]+'</span>';
        if(fb.note)h+='<span style="font-size:10.5px;color:var(--dim);font-style:italic">'+esc(fb.note)+'</span>';
        h+='</div>';
      }
      h+='</div>';
    });
    h+='<div style="display:flex;justify-content:flex-end;margin-top:10px"><button onclick="delTap('+orig+')" style="background:'+(confirmDel===orig?'var(--danger)':'transparent')+';border:1px solid '+(confirmDel===orig?'var(--danger)':'var(--line)')+';border-radius:8px;color:'+(confirmDel===orig?'#FFFFFF':'var(--dim)')+';padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer">'+(confirmDel===orig?'Tap again to delete':'Delete')+'</button></div>';
    h+='</div>';
  });
  return h+'</div>';
}

/* ── export view ── */
function viewExport(){
  return '<div class="wrap"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="btn bgrey" style="padding:7px 12px" data-goto="home" onclick="go(this.dataset.goto)">←</button><span style="font-size:19px;font-weight:700">Export</span></div>'
    +'<p class="dim" style="font-size:13px;line-height:1.55;margin:0 0 14px">Tap Copy, then paste into the chat. Includes all your feedback so I can update the program.</p>'
    +'<textarea id="exp" readonly>'+esc(exportText())+'</textarea>'
    +'<button id="cpy" class="btn bgold" style="width:100%;margin-top:12px" onclick="copyExp()">Copy to clipboard</button></div>';
}

/* ── timer loop ── */
setInterval(()=>{if(view==='workout'&&active){const e=document.getElementById('elapsed');if(e)e.textContent=clock(Math.floor((Date.now()-active.startedAt)/1000));}},1000);

if(active){wantWake=true;getWake();}
render();
</script></body></html>
